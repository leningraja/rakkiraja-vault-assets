<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 66" width="100%" height="100%">
  <defs>
    <linearGradient id="vwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 1)">
    <!-- Custom 'R' with card/vault motif -->
    <path fill="url(#vwGrad)" d="M0,0 h20 c10,0 16,6 16,15 c0,6 -4,11 -10,13 l13,24 h-11 l-12,-22 h-6 v22 h-10 v-52 z m10,8 v14 h10 c4,0 7,-3 7,-7 c0,-4 -3,-7 -7,-7 h-10 z" />
    
    <!-- Vault/Card Chip detail inside R -->
    <rect x="13" y="10" width="8" height="6" rx="1" fill="#1e293b" />
    <line x1="15" y1="13" x2="19" y2="13" stroke="#60a5fa" stroke-width="1.5" />

    <!-- 'akki' in adaptive metallic slate (visible on both light and dark backgrounds) -->
    <text x="41" y="38" font-family="&#39;Inter&#39;, system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="#64748b" letter-spacing="-1">akki</text>
    
    <!-- 'Raja' in Vaultwarden Blue-Indigo Gradient -->
    <text x="118" y="38" font-family="&#39;Inter&#39;, system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="url(#vwGrad)" letter-spacing="-1">Raja</text>

    <!-- 'VAULT' sub-label aligned cleanly underneath 'Raja' -->
    <g transform="translate(120, 48)">
      <!-- Subtle mini shield/lock dot accent -->
      <rect x="0" y="3" width="6" height="6" rx="1.5" fill="#3b82f6" />
      <text x="11" y="10" font-family="&#39;Inter&#39;, system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#94a3b8" letter-spacing="4.5">VAULT</text>
    </g>
  </g>
</svg>